name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not formatted:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  integration:
    name: Integration tests (psql-test, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: psql-sqlite
      - uses: actions/checkout@v4
        with:
          repository: portablesql/psql
          path: psql
      - uses: actions/checkout@v4
        with:
          repository: portablesql/psql-test
          path: psql-test
      - uses: actions/checkout@v4
        with:
          repository: portablesql/psql-mysql
          path: psql-mysql
      - uses: actions/checkout@v4
        with:
          repository: portablesql/psql-pgsql
          path: psql-pgsql
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Setup workspace
        run: |
          go work init ./psql ./psql-mysql ./psql-pgsql ./psql-sqlite ./psql-test
          go work sync
      - name: Build psql-test
        working-directory: psql-test
        run: go build ./...
      - name: Run psql-test against SQLite
        working-directory: psql-test
        run: go test -race -count=1 ./...
